<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Monitoramento: Pé Diabético</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6 font-sans">
    <div class="max-w-7xl mx-auto space-y-6">
        <h1 class="text-3xl font-bold text-gray-800">Painel de Monitoramento: Pé Diabético</h1>
        
        <!-- Upload Section -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <div>
                <label class="block mb-2 font-semibold text-gray-700">1. Upload: Relatório de Pacientes:</label>
                <input type="file" id="filePacientes" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
            </div>
            <div>
                <label class="block mb-2 font-semibold text-gray-700">2. Upload: Histórico de Datas:</label>
                <input type="file" id="fileDatas" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-blue-600 file:text-white hover:file:bg-blue-700 cursor-pointer">
            </div>
        </div>

        <!-- Metric Cards -->
        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center">
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total Pacientes</p>
                <h3 id="totalPacientes" class="text-3xl font-extrabold text-gray-800 mt-2">0</h3>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center">
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Total Avaliados</p>
                <h3 id="totalAvaliados" class="text-3xl font-extrabold text-blue-600 mt-2">0</h3>
            </div>
            <div class="bg-blue-600 p-6 rounded-2xl shadow-sm text-white text-center flex flex-col justify-center items-center">
                <span class="text-4xl mb-2">🦶</span>
                <span class="text-xs font-semibold uppercase tracking-wider">Cobertura</span>
                <span id="txtPorcentagem" class="text-3xl font-bold mt-1">0%</span>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 text-center">
                <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Avaliações Faltantes</p>
                <h3 id="totalFaltantes" class="text-3xl font-extrabold text-red-500 mt-2">0</h3>
            </div>
        </div>

        <!-- Charts -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold mb-4">Total por Faixa Etária</h2>
                <div class="h-64"><canvas id="chartIdade"></canvas></div>
            </div>
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
                <h2 class="text-lg font-bold mb-4">Distribuição por Microárea</h2>
                <div class="h-64"><canvas id="chartMicro"></canvas></div>
            </div>
        </div>

        <!-- Table -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
            <h2 class="text-lg font-bold mb-4">Lista de Pacientes Avaliados</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse" id="tabelaPacientes">
                    <thead class="bg-gray-50">
                        <tr class="border-b"><th class="p-4">Nº</th><th class="p-4">Data Atend.</th><th class="p-4">Nome</th><th class="p-4">Idade</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let dataPacientes = [];
        let dataHistorico = [];
        let charts = {};

        function normalizar(texto) { return String(texto || "").trim().toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, ""); }
        
        function formatarDataExcel(serial) {
            if (typeof serial !== 'number') return serial;
            const utc_days = Math.floor(serial - 25569);
            const date = new Date(utc_days * 86400 * 1000);
            return date.toLocaleDateString('pt-BR');
        }

        function lerArquivo(file, callback) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const data = new Uint8Array(e.target.result);
                const wb = XLSX.read(data, {type: 'array'});
                callback(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]]));
            };
            reader.readAsArrayBuffer(file);
        }

        document.getElementById('filePacientes').addEventListener('change', (e) => lerArquivo(e.target.files[0], (j) => { dataPacientes = j; processar(); }));
        document.getElementById('fileDatas').addEventListener('change', (e) => lerArquivo(e.target.files[0], (j) => { dataHistorico = j; processar(); }));

        function processar() {
            if (dataPacientes.length === 0) return;
            const avaliados = dataPacientes.filter(p => normalizar(p["Avaliação dos pés"]) === 'S');
            
            avaliados.forEach(p => {
                const nome = normalizar(p["Nome Completo"]);
                const reg = dataHistorico.find(h => normalizar(h["Paciente"] || h["Nome"]) === nome);
                p.dataAtendimento = reg ? formatarDataExcel(reg["Data do Atendimento"]) : "Não encontrada";
            });

            // Ordenação Crescente por data
            avaliados.sort((a, b) => {
                const d1 = a.dataAtendimento.split('/').reverse().join('-');
                const d2 = b.dataAtendimento.split('/').reverse().join('-');
                return new Date(d1) - new Date(d2);
            });

            document.getElementById('totalPacientes').innerText = dataPacientes.length;
            document.getElementById('totalAvaliados').innerText = avaliados.length;
            document.getElementById('totalFaltantes').innerText = dataPacientes.length - avaliados.length;
            document.getElementById('txtPorcentagem').innerText = ((avaliados.length / dataPacientes.length) * 100).toFixed(1) + '%';

            const tbody = document.querySelector('#tabelaPacientes tbody');
            tbody.innerHTML = avaliados.map((p, i) => `<tr class="border-b">
                <td class="p-4">${i+1}</td>
                <td class="p-4">${p.dataAtendimento}</td>
                <td class="p-4">${p["Nome Completo"]}</td>
                <td class="p-4">${p["Idade"]}</td>
            </tr>`).join('');
        }
    </script>
</body>
</html>
